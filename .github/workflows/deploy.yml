name: Deploy to EC2 (Development)

on:
  push:
    branches:
      - development
  workflow_dispatch:

env:
  NODE_VERSION: '22.x'

jobs:
  deploy:
    name: Deploy to EC2 - Dev
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: development

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: |
          if [ -f "package-lock.json" ]; then
            npm ci
          else
            echo "⚠️ package-lock.json not found, using npm install"
            npm install
          fi

      - name: Run linter (optional)
        run: |
          if [ -f ".eslintrc" ] || [ -f ".eslintrc.js" ] || [ -f ".eslintrc.json" ]; then
            npm run lint || true
          fi

      - name: Deploy to EC2 (Development)
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.DEC }}
          port: 22
          script: |
            set -e

            echo "🚀 Deploying DEVELOPMENT branch..."

            # Go to dev directory
            cd /home/${{ secrets.EC2_USER }}/SELLIT_DEV/sellit-backend_node || exit 1

            # Ensure correct branch
            git fetch origin
            git checkout development
            git reset --hard origin/development

            # Install production dependencies
            if [ -f "package-lock.json" ]; then
              npm ci --production
            else
              echo "⚠️ package-lock.json not found, using npm install"
              npm install --production
            fi

            # Restart app using PM2
            if command -v pm2 &> /dev/null; then
              pm2 restart sellit-dev-api || pm2 start server.js --name sellit-dev-api
            else
              echo "⚠️ PM2 not found, starting app manually"
              pkill -f "node server.js" || true
              nohup node server.js > app.log 2>&1 &
            fi

            # Verify app
            sleep 5
            if command -v pm2 &> /dev/null; then
              pm2 status
            else
              ps aux | grep "node server.js" | grep -v grep
            fi

      - name: Deployment Status
        run: echo "✅ Development deployment completed successfully!"
